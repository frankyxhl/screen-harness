[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-harness"
version = "0.2.0"
description = "CLI-first screen recording and SOP rendering harness for AI agents."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Frank Xu" },
]
keywords = ["screen-recording", "ffmpeg", "sop", "macos", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = []

[project.optional-dependencies]
macos = [
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-AVFoundation>=10.0",
]

[project.urls]
Homepage = "https://github.com/frankyxhl/screen-harness"
Issues = "https://github.com/frankyxhl/screen-harness/issues"
Source = "https://github.com/frankyxhl/screen-harness"

[project.scripts]
screen-harness = "screen_harness.run:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint.per-file-ignores]
# Recording scripts execute inside the `screen-harness -c` namespace where
# helpers are pre-imported at runtime — names are not defined in the file.
"examples/*" = ["F821"]

[tool.mypy]
python_version = "3.11"
files = ["src/screen_harness"]
# Pragmatic first gate: catch real type errors without demanding full
# annotation coverage of an existing codebase. Tighten over time.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# PyObjC bridge modules call into untyped Objective-C frameworks (Quartz,
# AppKit, AVFoundation) whose return values mypy sees as `object`. Annotating
# every bridge call is not worthwhile; skip attribute/return checks here.
# The pure-Python geometry helpers in hud.py are still covered by their tests.
module = ["screen_harness.screens", "screen_harness.hud"]
disable_error_code = ["attr-defined", "import-not-found", "import-untyped"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "macos: macOS-only tests requiring AVFoundation/Quartz (skipped on non-macOS CI)",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # macOS extras pinned in dev so the @pytest.mark.macos invariant tests
    # actually run (and exercise real PyObjC API surfaces) instead of silently
    # skipping in the project venv.
    "pyobjc-framework-Quartz>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.0 ; sys_platform == 'darwin'",
    # Pillow needed by HUD selftest and coloured-square invariant tests
    "pillow>=10.0",
]
