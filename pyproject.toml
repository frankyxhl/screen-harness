[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-harness"
version = "0.1.0"
description = "CLI-first screen recording and SOP rendering harness for AI agents."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Frank Xu" },
]
keywords = ["screen-recording", "ffmpeg", "sop", "macos", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/frankyxhl/screen-harness"
Issues = "https://github.com/frankyxhl/screen-harness/issues"
Source = "https://github.com/frankyxhl/screen-harness"

[project.scripts]
screen-harness = "screen_harness.run:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
