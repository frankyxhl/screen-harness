name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    # First gate: refuse to publish a tag that doesn't point at a commit on
    # `main`. Without this any contributor with push access could tag a stale
    # feature branch `v0.x.0` and the workflow would happily build + release
    # + publish that arbitrary commit. The version-vs-tag check inside `build`
    # only validates the pyproject string, not the commit's lineage.
    # `RELEASING.md` documents the expected flow (push to main → tag from
    # main); this job enforces it in CI.
    name: Verify tag commit is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assert tagged commit is reachable from origin/main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA which is NOT reachable from origin/main"
            echo "Releases must be cut from a commit on main. See RELEASING.md."
            exit 1
          fi
          echo "tag commit $GITHUB_SHA is on main: OK"

  test:
    name: Test on tag
    runs-on: ubuntu-latest
    needs:
      - verify-tag
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --locked --python 3.14

      - name: Run tests
        run: uv run --python 3.14 pytest -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME (-> $TAG_VERSION) does not match pyproject version $PKG_VERSION"
            exit 1
          fi
          echo "version OK: $PKG_VERSION"

      - name: Build
        run: uv build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: screen-harness-dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download distribution artifact
        uses: actions/download-artifact@v7
        with:
          name: screen-harness-dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - build
    environment:
      name: pypi
      url: https://pypi.org/p/screen-harness
    permissions:
      id-token: write  # required for PyPI Trusted Publisher (OIDC)
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v7
        with:
          name: screen-harness-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
