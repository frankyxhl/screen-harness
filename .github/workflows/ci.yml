name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python 3.14
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --locked --python 3.14

      - name: Run tests
        run: uv run --python 3.14 pytest -q

      - name: Compile Python files
        run: uv run --python 3.14 python -m compileall -q src tests examples

  test-macos:
    name: Test macOS Python 3.14
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Sync dependencies
        run: uv sync --locked --python 3.14

      - name: Run tests
        # -ra surfaces skip reasons so headless-runner gaps (no WindowServer,
        # no Screen Recording permission) stay visible in the job log.
        run: uv run --python 3.14 pytest -q -ra

  alfred:
    name: Validate Alfred docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate rules
        run: uvx --from fx-alfred af validate

  agent-docs:
    name: Validate agent-docs sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv run --python 3.14 python scripts/check_agent_docs.py

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs:
      - test
      - test-macos
      - alfred

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build distribution
        run: uv build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: screen-harness-dist
          path: dist/*
          if-no-files-found: error
