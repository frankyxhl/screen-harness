name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run ruff
        run: uvx ruff check src tests examples scripts

  test:
    name: Test Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full range pyproject.toml claims via requires-python / classifiers.
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Run tests
        run: uv run --python ${{ matrix.python }} pytest -q

      - name: Compile Python files
        run: uv run --python ${{ matrix.python }} python -m compileall -q src tests examples

  test-macos:
    name: Test macOS Python 3.14
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install ffmpeg
        # Regular `ffmpeg` provides avfoundation capture for recorder tests;
        # keg-only `ffmpeg-full` provides the libass subtitles/ass filters the
        # render pipeline prefers (render.py probes /opt/homebrew/opt/ffmpeg-full).
        run: brew install ffmpeg ffmpeg-full

      - name: Sync dependencies
        run: uv sync --locked --python 3.14

      - name: Run tests
        # -ra surfaces skip reasons so headless-runner gaps (no WindowServer,
        # no Screen Recording permission) stay visible in the job log.
        run: uv run --python 3.14 pytest -q -ra

  alfred:
    name: Validate Alfred docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate rules
        run: uvx --from fx-alfred af validate

  agent-docs:
    name: Validate agent-docs sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv run --python 3.14 python scripts/check_agent_docs.py

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs:
      - test
      - test-macos
      - alfred

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build distribution
        run: uv build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: screen-harness-dist
          path: dist/*
          if-no-files-found: error
